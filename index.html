<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
<title>커리어로드맵 워크북</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 슬라이드 한 장 = 화면 한 장. 상단 고정 바(단계 칩) + 본문 슬라이드 + 하단 저작권 바. 원본 PPT의 흰 바탕, 회색 표, 단계별 제목색을 그대로 옮김 */
:root{
  --display:'Black Han Sans','Noto Sans KR','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --bg:#ffffff; --ink:#1f1f23; --muted:#6f737c; --hair:#e3e4e8;
  --navy:#0a28a8; --head:#808080; --headink:#ffffff;
  --cell:#f2f2f2; --cell2:#e6e6e6; --cell3:#cbcbcb; --gap:#ffffff; --focus:#fff8d6;
  --bar:#d9d9d9; --teal:#3f9a86; --brown:#3b2a1e; --rule:#0a28a8; --red:#e5232b;
  --s0:#0a28a8; --s1:#ea5a23; --s2:#00aeef; --s3:#00a651; --ssum:#00a651;
  --ok:#0b8a4a; --warn:#b26a00; --bad:#c62828; --okbg:#e3f5ea; --warnbg:#fff1d6; --badbg:#fde6e6; --graybg:#eceef2;
  --green:#74ad8d; --leaf:#5fa8ad; --apple:#e43d48;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151b; --ink:#ececf1; --muted:#9aa0ad; --hair:#2b2e38;
  --navy:#8fa6ff; --head:#4b4f5c; --headink:#f3f3f6;
  --cell:#22252e; --cell2:#2a2e38; --cell3:#343946; --gap:#13151b; --focus:#2f3140;
  --bar:#22252e; --teal:#7cc4b0; --brown:#f0e6dc; --rule:#8fa6ff; --red:#ff6b6b;
  --s0:#8fa6ff; --s1:#ff8a5c; --s2:#43c6ff; --s3:#3ddc84; --ssum:#3ddc84;
  --ok:#5fdc9a; --warn:#f0b455; --bad:#ff8a8a; --okbg:#173a28; --warnbg:#3f3216; --badbg:#431d1d; --graybg:#262933;
  --green:#5f9a7c; --leaf:#6fb8bd; --apple:#ff6470; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151b; --ink:#ececf1; --muted:#9aa0ad; --hair:#2b2e38;
  --navy:#8fa6ff; --head:#4b4f5c; --headink:#f3f3f6;
  --cell:#22252e; --cell2:#2a2e38; --cell3:#343946; --gap:#13151b; --focus:#2f3140;
  --bar:#22252e; --teal:#7cc4b0; --brown:#f0e6dc; --rule:#8fa6ff; --red:#ff6b6b;
  --s0:#8fa6ff; --s1:#ff8a5c; --s2:#43c6ff; --s3:#3ddc84; --ssum:#3ddc84;
  --ok:#5fdc9a; --warn:#f0b455; --bad:#ff8a8a; --okbg:#173a28; --warnbg:#3f3216; --badbg:#431d1d; --graybg:#262933;
  --green:#5f9a7c; --leaf:#6fb8bd; --apple:#ff6470; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--hair)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px 4px}
.brand{font-family:var(--display);font-size:20px;color:var(--navy);margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--body);font-size:12px;color:var(--teal);font-weight:700;margin-left:8px;letter-spacing:.04em}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--hair);background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .tab[aria-pressed="true"]{color:#10131c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-pressed="true"]{color:#10131c}}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px;white-space:nowrap}
.status .st-err{color:var(--bad);font-weight:700}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter i{display:block;width:90px;height:6px;background:var(--cell3);border-radius:3px;overflow:hidden}
.meter i b{display:block;height:100%;background:var(--s3);width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--hair);background:transparent;border-radius:999px;padding:3px 11px 3px 9px;font-size:12.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--cell3)}
.chip[data-s="done"] .dot{background:var(--s3)}
.chip[data-s="part"] .dot{background:#f0a21a}
.chip[aria-current="page"]{border-color:var(--stg,var(--navy));box-shadow:inset 0 -3px 0 var(--stg,var(--navy));font-weight:700}

/* notices */
.note{margin:14px 0 0;padding:10px 14px;border-radius:6px;font-size:13.5px;background:var(--warnbg);color:var(--ink)}
.note.bad{background:var(--badbg)} .note.ok{background:var(--okbg)}

/* slide */
.slide{padding:14px 0 6px;--stg:var(--navy)}
.slide[data-stage="1"]{--stg:var(--s1)} .slide[data-stage="2"]{--stg:var(--s2)} .slide[data-stage="3"]{--stg:var(--s3)} .slide[data-stage="sum"]{--stg:var(--ssum)}
.stagehd{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px}
.stagehd b{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.4vw,28px);color:var(--stg);line-height:1.2}
.stagehd span{font-size:14px}
h2.ttl{font-family:var(--display);font-weight:400;color:var(--navy);text-align:center;font-size:clamp(26px,5.2vw,44px);line-height:1.25;margin:22px 0 26px;text-wrap:balance}
.hint{margin:0 0 8px;font-size:15px}
.quote{text-align:center;color:var(--muted);margin:26px 0 0;font-size:14px;text-wrap:balance}
.tw{overflow-x:auto;padding-bottom:2px}
table.rt{width:100%;min-width:640px;border-collapse:separate;border-spacing:2px;margin:0;table-layout:fixed}
.rt th,.rt td{padding:0;vertical-align:middle}
.rt thead th{background:var(--head);color:var(--headink);font-weight:500;padding:12px 8px;text-align:center;font-size:15px}
.rt tbody th{background:var(--cell);font-weight:500;text-align:center;padding:10px 8px;font-size:15px}
.rt td{background:var(--cell);position:relative}
.rt .r b{color:var(--red);font-weight:700}
.rt.alt tbody tr:nth-child(1) td,.rt.alt tbody tr:nth-child(1) th{background:var(--cell2)}
.rt.alt tbody tr:nth-child(2) td,.rt.alt tbody tr:nth-child(2) th{background:var(--cell3)}
.f{display:block;width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:10px 10px;border-radius:0;resize:none}
textarea.f{min-height:64px;line-height:1.5;overflow:hidden}
.f:focus{outline:2px solid var(--stg);outline-offset:-2px;background:var(--focus)}
.f::placeholder{color:var(--muted);opacity:.55}
.val{padding:10px 10px;white-space:pre-wrap;word-break:break-word;min-height:44px}
.val.empty{color:var(--muted);opacity:.6}
.chk{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;cursor:pointer;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--s3)}
.addrow{margin-top:10px;border:1px dashed var(--muted);background:transparent;padding:6px 14px;border-radius:6px;font-size:13px;color:var(--muted)}
.addrow:hover{color:var(--ink);border-color:var(--ink)}
.small-in{display:inline-block;width:4.2em;border:0;border-bottom:1.5px solid currentColor;background:transparent;color:inherit;font:inherit;text-align:center;padding:2px 0;border-radius:0}
.small-in:focus{outline:2px solid var(--stg);outline-offset:2px;background:var(--focus)}
.small-in.w2{width:3em}
.line-in{border:0;border-bottom:3px solid var(--rule);background:transparent;color:inherit;font:inherit;padding:2px 6px;min-width:0;border-radius:0}
.line-in:focus{outline:2px solid var(--navy);outline-offset:2px;background:var(--focus)}

/* nav */
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 0}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:10px 22px;border-radius:6px;font-weight:700;font-size:15px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn[disabled]{opacity:.35;cursor:default}
:root[data-theme="dark"] .btn:not(.ghost){color:#10131c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#10131c}}
.pg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* cover */
.cover{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:28px;align-items:center;padding:18px 0 4px}
.since{color:var(--teal);font-size:clamp(20px,3vw,26px);font-weight:500;letter-spacing:.03em;margin:0 0 4px}
.rule{height:4px;background:var(--rule)}
.ctitle{padding:20px 4px 22px;text-align:center;font-family:var(--display);color:var(--brown);line-height:1.1}
.ctitle .en{display:block;font-size:clamp(38px,7.6vw,74px)}
.ctitle .ko{display:block;font-size:clamp(34px,6.4vw,60px);margin-top:4px}
.cmeta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px 14px;align-items:center;margin:34px 0 28px;padding-left:clamp(0px,3vw,36px);font-size:18px}
.cmeta label{letter-spacing:.35em;white-space:nowrap}
.cmeta .line-in{width:100%;max-width:240px;border-bottom-width:2px}
.pledge{font-size:16px;line-height:2;padding-left:clamp(0px,1vw,10px)}
.pledge .nm{display:inline-block;min-width:9em;border-bottom:3px solid var(--rule);text-align:center;font-weight:700;padding:0 6px;min-height:1.6em;vertical-align:bottom}
.tree{width:100%;max-width:400px;height:auto;margin:0 auto;display:block;background:#fff;border-radius:6px}
@media (max-width:780px){.cover{grid-template-columns:1fr}.tree{max-width:340px}}

/* custom blocks */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card3{background:var(--cell);border-top:5px solid var(--c);padding:0 0 4px;border-radius:2px}
.card3 h3{margin:0;padding:12px 12px 2px;font-size:17px;color:var(--c);font-family:var(--display);font-weight:400}
.card3 p{margin:0;padding:0 12px 4px;font-size:12.5px;color:var(--muted)}
.card3 textarea.f{min-height:120px}
.jobcard{margin-top:12px;background:var(--cell);border:2px solid var(--navy);padding:0 0 4px}
.jobcard h3{margin:0;padding:12px 12px 2px;font-family:var(--display);font-weight:400;font-size:20px;color:var(--navy)}
.jobcard p{margin:0;padding:0 12px;font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.three{grid-template-columns:1fr}}
.swot{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.swot>div{background:var(--cell)}
.swot h3{margin:0;background:var(--head);color:var(--headink);font-weight:500;font-size:15px;text-align:center;padding:10px 8px}
.swot h3 em{font-style:normal;font-weight:700}
.swot textarea.f{min-height:130px}
@media (max-width:620px){.swot{grid-template-columns:1fr}}
.goalrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px;font-size:16px}
.goalrow .f{flex:1;min-width:200px;background:var(--cell)}
.fut-h{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;align-items:baseline}
.rem{font-family:var(--display);font-size:clamp(22px,4.4vw,36px);text-align:center;margin:8px 0 18px;line-height:1.7}
.rem .line-in{font-family:var(--display);width:min(100%,9em);text-align:center;color:var(--red);font-size:inherit}
.rem .val{display:inline-block;padding:0 8px;color:var(--red);border-bottom:3px solid var(--rule)}
.lab{font-weight:700;margin:16px 0 6px;font-size:15px}
.sign{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;margin-top:18px;font-size:16px}
.sign input.f{width:auto;background:var(--cell);padding:8px 12px}
.cmeta input.f{background:var(--cell);max-width:240px}
.decl p{margin:0 0 6px;font-size:16px}
.decl .nm{display:inline-block;min-width:7em;border-bottom:3px solid var(--rule);text-align:center;font-weight:700;padding:0 6px}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,230px) minmax(0,1fr);gap:18px 22px;align-items:center;max-width:900px;margin:0 auto}
.map h3{margin:0 0 4px;font-size:clamp(17px,2.6vw,22px);font-weight:700}
.map .corner{min-height:96px}
.map .corner.r{text-align:left}
.map .agg{white-space:pre-wrap;word-break:break-word;font-size:13.5px;color:var(--muted);max-height:9.5em;overflow:hidden}
.map .agg.empty{opacity:.55}
.oval{background:var(--green);color:#fff;border-radius:50%;aspect-ratio:1.8;display:grid;place-items:center;font-weight:700;font-size:clamp(16px,2.4vw,20px);width:100%}
.kw{color:var(--red);font-weight:700;font-size:clamp(17px,2.6vw,22px);display:flex;align-items:center;gap:2px}
.kw .line-in{color:var(--red);font-weight:700;width:min(100%,7em);border-bottom-width:2px;font-size:inherit}
.goal{text-align:center;margin:36px 0 0;font-size:clamp(18px,3vw,26px);line-height:2}
.goal .red{color:var(--red);font-weight:700}
.goal .line-in{color:var(--red);font-weight:700;text-align:center;width:min(100%,9em);font-size:inherit}
@media (max-width:640px){.map{grid-template-columns:1fr 1fr}.map .mid{grid-column:1/-1;order:-1;max-width:220px;margin:0 auto}}

/* intro */
.intro-ttl{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
.intro-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,300px);gap:20px 36px;align-items:center;padding-inline:clamp(0px,2vw,24px)}
.def-hd{display:inline-block;margin:0 0 14px;font-size:clamp(18px,2.4vw,22px);font-weight:500;border-bottom:2px solid var(--ink);padding-bottom:2px}
.def{display:flex;flex-direction:column;gap:8px;font-size:clamp(15px,2vw,18px);line-height:1.7}
.intro-art{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.sub-ttl{font-size:clamp(22px,3.6vw,32px);margin:38px 0 18px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step{--c:var(--s1);background:var(--cell);border-top:5px solid var(--c);padding:14px 16px 12px;display:flex;flex-direction:column;gap:6px}
.step[data-stage="2"]{--c:var(--s2)} .step[data-stage="3"]{--c:var(--s3)}
.step-n{font-family:var(--display);color:var(--c);font-size:18px}
.step-q{margin:0;font-size:16px;line-height:1.7}
.step-q b{color:var(--c);font-size:1.15em}
.step-i{margin:0;font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.step .linkbtn{align-self:flex-start;padding-left:0}
@media (max-width:760px){.intro-top{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}.lockup{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.lockup .brand{margin-right:0}
.logo{height:30px;width:auto;display:block;background:#fff;border-radius:4px;padding:1px}
.exp{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rem .line-in.nm-in{width:6.6em;color:var(--ink);font-size:.8em}
.rem-ta textarea.f{min-height:130px}
.oval{align-content:center;gap:4px;padding:10px 12px;text-align:center}
.oval input{background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.85);color:#fff;text-align:center;font:inherit;font-size:.82em;width:92%;padding:2px 4px;border-radius:0}
.oval input::placeholder{color:rgba(255,255,255,.78)}
.oval input:focus{outline:2px solid #fff;outline-offset:2px}
.oval span{font-size:.82em}
/* PDF/PPTX capture: always light */
.print{--bg:#ffffff;--ink:#1f1f23;--muted:#6f737c;--hair:#e3e4e8;--navy:#0a28a8;--head:#808080;--headink:#ffffff;--cell:#f2f2f2;--cell2:#e6e6e6;--cell3:#cbcbcb;--gap:#ffffff;--focus:#fff8d6;--bar:#d9d9d9;--teal:#3f9a86;--brown:#3b2a1e;--rule:#0a28a8;--red:#e5232b;--s0:#0a28a8;--s1:#ea5a23;--s2:#00aeef;--s3:#00a651;--ssum:#00a651;--green:#74ad8d;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.cap{width:1280px;min-height:720px;background:#fff;display:flex;flex-direction:column;padding:14px 40px 0}
.cap .slide{padding-top:6px}
.cap-hd{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);padding-bottom:6px}
.cap-hd img{height:30px;width:auto;display:block}
.cap-hd b{margin-left:auto;color:var(--ink);font-size:15px}
.cap .notice{margin:auto -40px 0}
.cap .tw{overflow:visible}.who{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;min-width:0}.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}.who .linkbtn{font-size:12px}
.gate{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:10px}.gate-in{background:var(--cell);border-bottom:3px solid var(--rule);font-size:18px;padding:12px 14px}.gate-err{color:var(--bad);min-height:1.4em;margin:0;font-size:13.5px}.gate .btn{align-self:flex-start}
.cs-in{border:1px solid var(--hair);background:var(--cell);color:inherit;padding:7px 10px;border-radius:6px;font:inherit;min-width:160px}
.privacy{background:var(--cell);padding:12px 16px;border-radius:6px;margin:14px 0;font-size:13.5px;line-height:1.7}.privacy ul{margin:6px 0 0;padding-left:18px}
.consent{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14.5px;cursor:pointer}.consent input{width:20px;height:20px;margin-top:2px;accent-color:var(--navy);flex:none}
/* submit page */
.sub{max-width:760px;margin:0 auto}
.sec-list{list-style:none;margin:16px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.sec-list li{display:flex;align-items:center;gap:8px;background:var(--cell);padding:8px 12px;border-radius:4px;font-size:14px}
.sec-list li button{all:unset;cursor:pointer;flex:1;min-width:0}
.sec-list li button:focus-visible{outline:3px solid var(--navy)}
.tag{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.tag.done{background:var(--okbg);color:var(--ok)} .tag.part{background:var(--warnbg);color:var(--warn)} .tag.none{background:var(--graybg);color:var(--muted)} .tag.bad{background:var(--badbg);color:var(--bad)}
.subact{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* admin */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0}
.tile{background:var(--cell);padding:12px 14px;border-radius:6px}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.ok b{color:var(--ok)} .tile.warn b{color:var(--warn)}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:8px 0 12px}
.tools input[type=search]{flex:1;min-width:160px;border:1px solid var(--hair);background:var(--cell);color:inherit;padding:8px 10px;border-radius:6px;font:inherit}
.btn.sm{padding:6px 14px;font-size:13px}
.at{width:100%;border-collapse:collapse;min-width:620px}

function rowsOf(sec,d){
  if(Array.isArray(sec.rows))return sec.rows.map(function(r){return{k:r.k,label:r.label,rtype:r.rtype,labeled:true}});
  var n=Math.max(sec.rows,parseInt(d["n:"+sec.id],10)||0),out=[];
  for(var i=1;i<=n;i++)out.push({k:"r"+i,labeled:false,idx:i});
  return out;
}
function fieldsOf(sec,d){
  var f=[],id=sec.id;
  function add(k,l,c){f.push({key:k,label:l,count:c!==false})}
  if(sec.type==="table"){
    rowsOf(sec,d).forEach(function(r,i){
      var rl=r.labeled?strip(r.label):("행 "+(i+1));
      sec.cols.forEach(function(c){add(id+"."+r.k+"."+c.k,rl+" - "+strip(c.label),c.ctype!=="check")});
    });

  else if(sec.type==="three"){add("three.like","좋아하는 것");add("three.good","잘 하는 것");add("three.meaning","의미 있는 것");add("three.job","Job")}
  else if(sec.type==="swot"){add("swot.goal","목표");add("swot.S","강점(S)");add("swot.W","약점(W)");add("swot.O","기회(O)");add("swot.T","위협(T)")}
  else if(sec.type==="future"){
    add("future.y0","현재 연도");add("future.a0","현재 나이");add("future.y1","미래 연도");add("future.a1","미래 나이");
    FUT.forEach(function(r){add("future."+r[0]+".now","현재 "+r[1]);add("future."+r[0]+".next","미래 "+r[1])});
  }else if(sec.type==="life"){AGES.forEach(function(a){add("life."+a[0]+".task",a[0]+" 과제");add("life."+a[0]+".job",a[0]+" 직업")})}

  else if(sec.type==="decl"){add("decl.reward","보상");add("decl.thanks","감사",false);add("decl.sign","서명");add("decl.date","날짜")}
  else if(sec.type==="summary"){add("sum.kw","나의 강점 키워드");add("sum.kwW","나의 약점 키워드");add("sum.kwO","나의 기회 키워드");add("sum.kwT","나의 위협 키워드");add("sum.mod","로드맵 중심 수식어");add("sum.goal","(목표) 나는 ○○ 커리어코치가 될 것이다")}

}

/* ---------- save ---------- */

function currentName(){return String(S.d["cover.name"]||"").trim()||S.myName||""}
function payload(){
  var ids=progressOf(S.d);
  return {v:1,uid:S.uid,email:S.email||"",name:currentName(),d:S.d,done:ids.length,total:TOTAL,doneIds:ids,
    submitted:!!S.doc.submitted,submittedAt:S.doc.submittedAt||0,updatedAt:S.doc.updatedAt||Date.now()};

function markDirty(){
  S.doc.updatedAt=Date.now();
  ls.set(lsKey(),JSON.stringify({d:S.d,doc:S.doc}));
  setStatus(S.canWrite?"저장 대기 중…":"이 기기에 임시 저장됨");
  clearTimeout(S.dirtyT);S.dirtyT=setTimeout(flush,1000);
}
async function flush(){
  clearTimeout(S.dirtyT);
  if(!S.canWrite||!S.db||!S.uid)return;
  if(S.saving){S.pending=true;return}
  var p=payload(),sig=JSON.stringify([p.d,p.submitted,p.submittedAt,p.name]);
  if(sig===S.lastSig){setStatus("저장됨 · "+fmtTime(Date.now()).split(" ")[1]);return}
  S.saving=true;setStatus("저장 중…");
  try{
    await S.db.doc("roadmaps/"+S.uid).set(p);
    S.lastSig=sig;setStatus("저장됨 · "+fmtTime(Date.now()).split(" ")[1]);
  }catch(e){
    if(e&&e.code==="invalid_argument"){S.canWrite=false;setStatus("이 계정은 서버에 저장할 수 없습니다. 이 기기에만 저장됩니다.",true);renderBody()}
    else setStatus("저장 실패 · 잠시 후 다시 시도합니다",true),S.pending=true,setTimeout(function(){S.pending=false;flush()},5000);
  }
  S.saving=false;
  if(S.pending){S.pending=false;flush()}
}
document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});

  if(type==="check"){
    var cb=h("input",{type:"checkbox",id:"f-"+key,"aria-label":"실행 체크"});cb.checked=!!v;
    cb.addEventListener("change",function(){ctx.set(key,cb.checked?"1":"")});
    return h("label",{class:"chk"},cb,h("span",null,"완료"));
  }
  var el;
  if(type==="area"){el=h("textarea",{class:"f",id:"f-"+key,rows:"2",placeholder:ph||""});el.value=v;
    el.addEventListener("input",function(){autosize(el);ctx.set(key,el.value)});

/* ---------- 작성 내용을 PPTX 안에 넣고 다시 꺼내기 ----------
   문서 속성(사용자 지정 속성)에 나눠 넣습니다. 파워포인트에서 열어 다시 저장해도 유지됩니다. */
var CR_CHUNK=240;
function xmlEsc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
async function embedData(buf,d){
  var Z=await lib("zip"),zip=await Z.loadAsync(buf);
  var cp=Array.from(JSON.stringify({v:1,d:d})),parts=[];
  for(var i=0;i<cp.length;i+=CR_CHUNK)parts.push(cp.slice(i,i+CR_CHUNK).join(""));
  var props=[["CR_COUNT",String(parts.length)]].concat(parts.map(function(p,i){return["CR_"+i,p]}));
  var xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/custom-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes">'+
    props.map(function(p,i){return '<property fmtid="{D5CDD505-2E9C-101B-9397-08002B2CF9AE}" pid="'+(i+2)+'" name="'+p[0]+'"><vt:lpwstr>'+xmlEsc(p[1])+'</vt:lpwstr></property>'}).join("")+'</Properties>';
  zip.file("docProps/custom.xml",xml);
  var ct=await zip.file("[Content_Types].xml").async("string");
  if(ct.indexOf("/docProps/custom.xml")<0)ct=ct.replace("</Types>",'<Override PartName="/docProps/custom.xml" ContentType="application/vnd.openxmlformats-officedocument.custom-properties+xml"/></Types>');
  zip.file("[Content_Types].xml",ct);
  var rels=await zip.file("_rels/.rels").async("string");
  if(rels.indexOf("docProps/custom.xml")<0)rels=rels.replace("</Relationships>",'<Relationship Id="rIdCR1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/custom-properties" Target="docProps/custom.xml"/></Relationships>');
  zip.file("_rels/.rels",rels);
  return zip.generateAsync({type:"arraybuffer",compression:"DEFLATE"});
}
async function readData(file){
  var Z=await lib("zip"),zip;
  try{zip=await Z.loadAsync(await file.arrayBuffer())}catch(e){throw new Error("notpptx")}
  var f=zip.file("docProps/custom.xml");if(!f)throw new Error("nodata");
  var doc=new DOMParser().parseFromString(await f.async("string"),"application/xml"),map={};
  Array.prototype.forEach.call(doc.getElementsByTagName("*"),function(el){
    if(el.localName==="property"&&/^CR_/.test(el.getAttribute("name")||""))map[el.getAttribute("name")]=el.textContent;
  });
  var n=parseInt(map.CR_COUNT,10),s="";
  if(!(n>0))throw new Error("nodata");
  for(var i=0;i<n;i++){if(map["CR_"+i]==null)throw new Error("nodata");s+=map["CR_"+i]}
  var o=JSON.parse(s);if(!o||typeof o.d!=="object")throw new Error("nodata");
  return o.d;
}

function csvEsc(v){v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadCsv(){

  var cols=[];SECS.forEach(function(sec,i){fieldsOf(sec,merged).forEach(function(f){cols.push({key:f.key,label:(i+1)+"."+sec.short+" · "+f.label})})});
  var head=["이름","이메일","상태","완료 섹션","제출 일시","최종 수정"].concat(cols.map(function(c){return c.label}));
  var lines=[head.map(csvEsc).join(",")];
  adminList().forEach(function(x){
    var r=x.row,d=(r&&r.d)||{},st=statusOf(r);
    lines.push([x.name,x.email||"",st.t,r?r.done+"/"+r.total:"",r&&r.submittedAt?new Date(r.submittedAt).toLocaleString("ko-KR"):"",r?new Date(r.updatedAt).toLocaleString("ko-KR"):""].concat(cols.map(function(c){return d[c.key]||""})).map(csvEsc).join(","));
  });
  var t=new Date();save("커리어로드맵_제출현황_"+t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())+".csv","﻿"+lines.join("\r\n"));
}

      h("label",{for:"f-email",class:"lab",style:"margin:6px 0 0"},"이메일 주소"),inp,

      err,btn,

async function loadState(){
  S.d={};S.doc={submitted:false,submittedAt:0,updatedAt:0};S.lastSig="";
  var local=null;try{local=JSON.parse(ls.get(lsKey())||"null")}catch(e){}
  var remote=null;
  if(S.db&&S.uid){try{var snap=await S.db.doc("roadmaps/"+S.uid).get();if(snap.exists)remote=snap.data()}catch(e){}}
  if(remote){
    S.d=Object.assign({},remote.d||{});S.doc={submitted:!!remote.submitted,submittedAt:remote.submittedAt||0,updatedAt:remote.updatedAt||0};
    S.lastSig=JSON.stringify([S.d,S.doc.submitted,S.doc.submittedAt,remote.name||""]);
    if(local&&local.doc&&local.doc.updatedAt>S.doc.updatedAt+2000){S.d=local.d||S.d;S.doc=local.doc;S.lastSig=""}
  }else if(local){S.d=local.d||{};S.doc=Object.assign({submitted:false,submittedAt:0,updatedAt:0},local.doc||{})}
  S.loaded=true;
  if(S.canWrite&&!S.lastSig&&Object.keys(S.d).length)flush();
}
async function boot(){

    try{S.uid=await user.id();var me=await user.me();S.myName=me&&me.name||"";S.isAdmin=!!(await user.isOwner());if(me&&me.email){S.email=String(me.email).toLowerCase();S.verified=true}}catch(e){}
    try{var cw=await user.can("data.write");S.canWrite=!!S.db&&!!S.uid&&cw!==false}catch(e){S.canWrite=!!S.db&&!!S.uid}
  }
  if(S.db){
    try{var cs0=await S.db.doc("config/course").get();if(cs0.exists&&cs0.data().label)S.course=cs0.data().label}catch(e){}
    if(!S.isAdmin){try{var rs0=await S.db.doc("config/roster").get();if(rs0.exists)S.roster=rs0.data().names||[]}catch(e){}}

  setWho();  setStatus(S.canWrite?"자동 저장 켜짐":"이 기기에 임시 저장됨");

    S.db.collection("roadmaps").onSnapshot(function(q){S.rows=q.docs.map(function(x){return x.data()}).filter(function(r){return r&&r.uid});if(S.tab==="admin"&&document.activeElement.tagName!=="TEXTAREA")renderBody()},function(){});

  }
